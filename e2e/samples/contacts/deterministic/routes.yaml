version: 1.0.0
includes:
  - types:
      filter: tag == "view_type"
combined_routes:
  - contact:
      route: /api/contacts/{id}
      combines:
        - address:
            route: /addresses
        - phone:
            route: /phones
  - contact_group:
      route: /api/contact-groups/{id}
      combines:
        - contact:
            via: contact_group_member
            target: contact
            route: /members
routes:
  - contact:
      eager_read_path:
        - addresses
        - phones
      eager_update_path:
        - addresses
        - phones
  - contact_group:
      eager_read_path:
        - members
  - import_contacts:
      path: /api/contacts/import
      method: POST
      description: Bulk-import contacts from a CSV or vCard payload.
      request: import_contacts_request
      response: import_contacts_result
      service: ContactImportService
      x-implementation: stub
      function: import
  - migrate_legacy_contacts:
      path: /api/legacy-contacts/migrate
      method: POST
      description: Migrate rows from the legacy OldContactsTbl into the canonical contacts table.
      response: legacy_migration_result
      service: LegacyMigrationService
      x-implementation: stub
      function: migrate
