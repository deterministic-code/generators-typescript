        - target_type:
            type: string
            size: 64
        - constraints:
            type: string
            size: 128
            is_nullable: true
        - converter:
            type: string
            size: 64
            is_nullable: true
        - rust_converter:
            type: string
            size: 64
            is_nullable: true
