# Canonical field-type catalog — the single hand-owned source of truth for
# datasource field types, their allowed default-value tokens, and their
# per-language / per-dialect mappings. Read directly by the offline generators +
# spec validator (scripts/lib/field-type-catalog.mjs) and `includes:`-merged
# into the deterministic backend model so the same rows migrate + serve over /api.
types:
  - field_type:
      datasource_type: "readonly-lookup"
      fields:
        - name:
            type: string
            size: 32
            is_unique: true
        - supports_size:
            type: boolean
            default_value: false
        - default_value:
            type: string
            size: 64
            is_nullable: true
        - base_converter:
            type: string
            size: 64
            default_value: none
        - constraints:
            type: string
            size: 128
            is_nullable: true
        - min_value:
            type: string
            size: 32
            is_nullable: true
        - max_value:
            type: string
            size: 32
            is_nullable: true
        - sort_order:
            type: number
      seeds:
        - id1:
            name: "string"
            supports_size: true
            default_value: null
            base_converter: "none"
            constraints: ""
            sort_order: 1
        - id2:
            name: "character"
            supports_size: true
            default_value: null
            base_converter: "none"
            constraints: "fixed length"
            sort_order: 2
        - id3:
            name: "number"
            supports_size: false
            default_value: "0"
            base_converter: "none"
            constraints: ""
            sort_order: 3
        - id4:
            name: "integer"
            supports_size: false
            default_value: "0"
            base_converter: "none"
            constraints: ""
            min_value: "-2147483648"
            max_value: "2147483647"
            sort_order: 4
        - id5:
            name: "smallinteger"
            supports_size: false
            default_value: "0"
            base_converter: "none"
            constraints: ""
            min_value: "-32768"
            max_value: "32767"
            sort_order: 5
        - id6:
            name: "biginteger"
            supports_size: false
            default_value: "0"
            base_converter: "none"
            constraints: ""
            min_value: "-9223372036854775808"
            max_value: "9223372036854775807"
            sort_order: 6
        - id7:
            name: "float"
            supports_size: false
            default_value: "0"
            base_converter: "none"
            constraints: ""
            sort_order: 7
        - id8:
            name: "decimal"
            supports_size: true
            default_value: "0"
            base_converter: "decimalFieldConverter"
            constraints: "size: [precision, scale]"
            sort_order: 8
        - id9:
            name: "boolean"
            supports_size: false
            default_value: "false"
            base_converter: "booleanFieldConverter"
            constraints: "sqlite|mysql: 0|1; postgres: native"
            sort_order: 9
        - id10:
            name: "datetime"
            supports_size: false
            default_value: null
            base_converter: "dateTimeFieldConverter"
            constraints: "sqlite: ISO 8601; mysql|postgres: native Date"
            sort_order: 10
        - id11:
            name: "binary"
            supports_size: true
            default_value: null
            base_converter: "binaryFieldConverter"
            constraints: ""
            sort_order: 11
        - id12:
            name: "uuid"
            supports_size: false
            default_value: null
            base_converter: "uuidFieldConverter"
            constraints: "RFC-4122"
            sort_order: 12
        - id13:
            name: "reference"
            supports_size: false
            default_value: null
            base_converter: "none"
            constraints: "foreign key"
            sort_order: 13

  - field_type_validator:
      datasource_type: "readonly-lookup"
      fields:
        - field_type_id:
            type: number
            references: field_type.id
        - token:
            type: string
            size: 32
        - regex:
            type: string
            size: 256
        - description:
            type: string
            size: 256
            is_nullable: true
      seeds:
        - id1:
            field_type_id: 1
            token: "Literal"
            regex: "^.*$"
            description: "any string literal"
        - id2:
            field_type_id: 2
            token: "Literal"
            regex: "^.$"
            description: "single character literal"
        - id3:
            field_type_id: 3
            token: "Literal"
            regex: '^-?\d+$'
            description: "integer literal"
        - id4:
            field_type_id: 4
            token: "Literal"
            regex: '^-?\d+$'
            description: "integer literal"
        - id5:
            field_type_id: 5
            token: "Literal"
            regex: '^-?\d+$'
            description: "integer literal"
        - id6:
            field_type_id: 6
            token: "Literal"
            regex: '^-?\d+$'
            description: "integer literal"
        - id7:
            field_type_id: 7
            token: "Literal"
            regex: '^-?\d+(\.\d+)?$'
            description: "floating-point literal"
        - id8:
            field_type_id: 8
            token: "Literal"
            regex: '^-?\d+(\.\d+)?$'
            description: "decimal literal"
        - id9:
            field_type_id: 9
            token: "Literal"
            regex: "^(true|false)$"
            description: "true or false"
        - id10:
            field_type_id: 10
            token: "Now"
            regex: "^Now$"
            description: "local-time now at insert"
        - id11:
            field_type_id: 10
            token: "UtcNow"
            regex: "^UtcNow$"
            description: "UTC now at insert"
        - id12:
            field_type_id: 10
            token: "DateTime"
            regex: '^DateTime\(''.*''\)$'
            description: "explicit timestamp, e.g. DateTime('2026-01-01T00:00:00Z')"
        - id13:
            field_type_id: 11
            token: "Hex"
            regex: '^Hex\(''[0-9a-fA-F]*''\)$'
            description: "hex byte literal, e.g. Hex('DEADBEEF')"
        - id14:
            field_type_id: 12
            token: "NewId"
            regex: "^NewId$"
            description: "generate a new uuid at insert"
        - id15:
            field_type_id: 12
            token: "Empty"
            regex: "^Empty$"
            description: "the all-zero uuid"
        - id16:
            field_type_id: 12
            token: "Uuid"
            regex: '^uuid\(''[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}''\)$'
            description: "explicit uuid literal"

